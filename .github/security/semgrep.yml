rules:
  - id: agentoffice-electron-ignore-tls
    languages: [javascript, typescript]
    severity: ERROR
    message: Do not disable Electron TLS certificate validation.
    pattern-either:
      - pattern: $APP.commandLine.appendSwitch("ignore-certificate-errors")
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
  - id: agentoffice-electron-node-integration
    languages: [javascript, typescript]
    severity: ERROR
    message: Renderer Node integration must not be enabled.
    pattern: |
      new $WINDOW({..., webPreferences: {..., nodeIntegration: true, ...}, ...})
  - id: agentoffice-electron-disable-isolation
    languages: [javascript, typescript]
    severity: ERROR
    message: Renderer context isolation must not be disabled.
    pattern: |
      new $WINDOW({..., webPreferences: {..., contextIsolation: false, ...}, ...})
  - id: agentoffice-python-unverified-ssl
    languages: [python]
    severity: ERROR
    message: Do not construct an unverified SSL context.
    pattern: ssl._create_unverified_context(...)
