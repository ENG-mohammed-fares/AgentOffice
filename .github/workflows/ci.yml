name: AgentOffice CI

on:
  push:
    branches-ignore: [development]
  pull_request:
  workflow_dispatch:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: agentoffice-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  office-ktx2:
    name: Build verified compressed office textures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Generate office asset from versioned source
        run: |
          python -m pip install "numpy==2.3.5" "scipy==1.17.0" "trimesh==4.11.1" "Pillow==12.3.0"
          python assets/agile-office/build_scene.py
          python assets/agile-office/export_glb.py
          mkdir -p compressed
      - name: Verify and install KTX Software 4.4.2
        run: |
          curl -fL --retry 2 https://github.com/KhronosGroup/KTX-Software/releases/download/v4.4.2/KTX-Software-4.4.2-Linux-x86_64.deb -o "$RUNNER_TEMP/ktx.deb"
          echo "ca635ed489d8bf54fac8d7687056c651193de0740830a7738cc034adc63e3027  $RUNNER_TEMP/ktx.deb" | sha256sum -c -
          sudo apt-get install -y "$RUNNER_TEMP/ktx.deb"
      - name: Encode and validate actual base color maps
        run: python assets/agile-office/compress-ktx2.py assets/agile-office/office.glb compressed/office-ktx2.glb
      - uses: actions/upload-artifact@v6
        with:
          name: agentoffice-compressed-textures
          path: compressed/
          if-no-files-found: error
          retention-days: 14

  windows-validation:
    needs: office-ktx2
    name: Windows build and tests
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate and extract source archive
        shell: pwsh
        run: |
          python scripts/ci-prepare.py
          if ($LASTEXITCODE -ne 0) { throw 'Source archive validation failed.' }

      - name: Apply branding and authentication source
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "Pillow>=11,<13"
          if ($LASTEXITCODE -ne 0) { throw 'Pillow install failed.' }
          python scripts/apply-branding.py
          if ($LASTEXITCODE -ne 0) { throw 'Branding failed.' }
          python scripts/apply-auth.py
          if ($LASTEXITCODE -ne 0) { throw 'Authentication preparation failed.' }

      - name: Build the authenticated office assets
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "numpy==2.3.5" "scipy==1.17.0" "trimesh==4.11.1" "Pillow==12.3.0"
          if ($LASTEXITCODE -ne 0) { throw 'Office dependency installation failed.' }
          python scripts/apply-agile-office.py
          if ($LASTEXITCODE -ne 0) { throw 'Office asset preparation failed.' }

      - name: Bundle the verified compressed asset
        uses: actions/download-artifact@v7
        with:
          name: agentoffice-compressed-textures
          path: app/public/office
      - name: Validate compressed and original geometry
        run: python assets/agile-office/verify-ktx2.py app/public/office

      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          $files = Get-ChildItem ./app/src, ./app/electron, ./app/scripts -Recurse -File | Where-Object { $_.Extension -in '.js', '.cjs', '.mjs' }
          foreach ($file in $files) {
            node --check $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Syntax check failed: $($file.FullName)" }
          }

      - name: Install dependencies
        working-directory: app
        shell: pwsh
        run: |
          if (Test-Path '../package-lock.json') {
            Copy-Item ../package-lock.json ./package-lock.json -Force
          }
          if (Test-Path './package-lock.json') {
            'true' | Set-Content -Encoding ascii ../ci-lock-present.txt
            npm ci --no-audit --no-fund
          } else {
            'false' | Set-Content -Encoding ascii ../ci-lock-present.txt
            npm install --no-audit --no-fund
          }
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed.' }

      - name: Upload resolved dependency lock
        uses: actions/upload-artifact@v6
        with:
          name: agentoffice-dependency-lock
          path: app/package-lock.json
          if-no-files-found: error
          retention-days: 30

      - name: Validate coverage reporter and measure tooling coverage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force coverage | Out-Null
          Remove-Item Env:NODE_V8_COVERAGE -ErrorAction SilentlyContinue
          node --test --experimental-test-coverage "--test-coverage-include=scripts/run-coverage.cjs" --test-reporter=spec --test-reporter-destination=stdout --test-reporter=lcov --test-reporter-destination=coverage/tooling-lcov.info scripts/coverage-report.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Coverage reporter tests failed.' }
          if (!(Test-Path coverage/tooling-lcov.info)) { throw 'Tooling LCOV missing.' }
          if (!(Select-String -Path coverage/tooling-lcov.info -Pattern '^SF:.*run-coverage\.cjs

      - name: Unit tests with production-source code coverage
        run: node scripts/run-coverage.cjs

      - name: Upload code coverage reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agentoffice-code-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 30

      - name: Require SonarCloud credentials for trusted development analysis
        if: github.repository == 'ENG-mohammed-fares/AgentOffice' && (github.ref == 'refs/heads/development' || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'development' && github.event.pull_request.head.repo.full_name == github.repository))
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) {
            throw 'SONAR_TOKEN is required for development Quality Gate.'
          }
          if (!(Test-Path coverage/lcov.info)) { throw 'Coverage report missing.' }

      - name: SonarCloud analysis and blocking Quality Gate
        if: github.repository == 'ENG-mohammed-fares/AgentOffice' && (github.ref == 'refs/heads/development' || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'development' && github.event.pull_request.head.repo.full_name == github.repository))
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Package local KTX2 transcoder
        working-directory: app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force public/basis | Out-Null
          Copy-Item node_modules/three/examples/jsm/libs/basis/basis_transcoder.js public/basis/
          Copy-Item node_modules/three/examples/jsm/libs/basis/basis_transcoder.wasm public/basis/

      - name: Production Vite build
        working-directory: app
        run: npm run build --ignore-scripts

      - name: Electron authentication smoke tests
        working-directory: app
        run: npx --no-install electron scripts/auth-smoke.cjs

      - name: Package tested Windows build (no publishing)
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npx --no-install electron-builder --config electron-builder.config.cjs --win nsis --x64 --publish never

      - name: Prepare candidate manifest and verify update metadata
        shell: pwsh
        run: python scripts/release-candidate.py create

      - name: Upload Windows candidate for QA
        uses: actions/upload-artifact@v6
        with:
          name: agentoffice-windows-candidate
          path: candidate/
          if-no-files-found: error
          retention-days: 30

      - name: Dependency security audit (blocking high and critical)
        working-directory: app
        run: npm audit --audit-level=high

      - name: Require committed dependency lock for release eligibility
        shell: pwsh
        run: |
          if ((Get-Content ./ci-lock-present.txt -Raw).Trim() -ne 'true') {
            throw 'Commit the reviewed package-lock.json from the dependency-lock artifact before release.'
          }
 -Quiet)) { throw 'Coverage runner missing from tooling report.' }

      - name: Unit tests with production-source code coverage
        run: node scripts/run-coverage.cjs

      - name: Upload code coverage reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agentoffice-code-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 30

      - name: Require SonarCloud credentials for trusted development analysis
        if: github.repository == 'ENG-mohammed-fares/AgentOffice' && (github.ref == 'refs/heads/development' || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'development' && github.event.pull_request.head.repo.full_name == github.repository))
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) {
            throw 'SONAR_TOKEN is required for development Quality Gate.'
          }
          if (!(Test-Path coverage/lcov.info)) { throw 'Coverage report missing.' }

      - name: SonarCloud analysis and blocking Quality Gate
        if: github.repository == 'ENG-mohammed-fares/AgentOffice' && (github.ref == 'refs/heads/development' || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'development' && github.event.pull_request.head.repo.full_name == github.repository))
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Package local KTX2 transcoder
        working-directory: app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force public/basis | Out-Null
          Copy-Item node_modules/three/examples/jsm/libs/basis/basis_transcoder.js public/basis/
          Copy-Item node_modules/three/examples/jsm/libs/basis/basis_transcoder.wasm public/basis/

      - name: Production Vite build
        working-directory: app
        run: npm run build --ignore-scripts

      - name: Electron authentication smoke tests
        working-directory: app
        run: npx --no-install electron scripts/auth-smoke.cjs

      - name: Package tested Windows build (no publishing)
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npx --no-install electron-builder --config electron-builder.config.cjs --win nsis --x64 --publish never

      - name: Prepare candidate manifest and verify update metadata
        shell: pwsh
        run: python scripts/release-candidate.py create

      - name: Upload Windows candidate for QA
        uses: actions/upload-artifact@v6
        with:
          name: agentoffice-windows-candidate
          path: candidate/
          if-no-files-found: error
          retention-days: 30

      - name: Dependency security audit (blocking high and critical)
        working-directory: app
        run: npm audit --audit-level=high

      - name: Require committed dependency lock for release eligibility
        shell: pwsh
        run: |
          if ((Get-Content ./ci-lock-present.txt -Raw).Trim() -ne 'true') {
            throw 'Commit the reviewed package-lock.json from the dependency-lock artifact before release.'
          }
