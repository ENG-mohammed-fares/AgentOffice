name: Compress verified hybrid office candidate
on:
  push:
    branches: ['perf/1.6.17-baked-compression']
    paths:
      - '.github/workflows/office-baked-compression.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compress:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          name: office-hybrid-review-candidate
          run-id: 45665153041
          github-token: ${{ github.token }}
          path: source-candidate
      - name: Verify original bake artifact
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('source-candidate')
          report = json.loads((root / 'bake-report.json').read_text())
          assert report['mode'] == 'combined'
          assert report['baked_nodes']
          assert report['candidate']['triangles'] == 117254
          assert hashlib.sha256((root / 'office-baked.glb').read_bytes()).hexdigest() == report['candidate']['sha256']
          PY
      - name: Install verified texture tools
        run: |
          python -m pip install --only-binary :all: "Pillow==12.3.0"
          curl --proto '=https' --proto-redir '=https' -fL --retry 2 https://github.com/KhronosGroup/KTX-Software/releases/download/v4.4.2/KTX-Software-4.4.2-Linux-x86_64.deb -o "$RUNNER_TEMP/ktx.deb"
          echo "ca635ed489d8bf54fac8d7687056c651193de0740830a7738cc034adc63e3027  $RUNNER_TEMP/ktx.deb" | sha256sum -c -
          sudo apt-get install -y "$RUNNER_TEMP/ktx.deb"
      - name: Encode and validate all base-color maps
        run: |
          mkdir -p compressed-candidate
          python assets/agile-office/compress-ktx2.py source-candidate/office-baked.glb compressed-candidate/office-baked-ktx2.glb
      - name: Prove geometry and baked material metadata are unchanged
        run: |
          python - <<'PY'
          import hashlib, json, struct
          from pathlib import Path
          def read(path):
              raw = Path(path).read_bytes()
              n = struct.unpack_from('<I', raw, 12)[0]
              return json.loads(raw[20:20+n]), raw[28+n:]
          a, ab = read('source-candidate/office-baked.glb')
          b, bb = read('compressed-candidate/office-baked-ktx2.glb')
          for key in ('nodes','meshes','materials','accessors','scenes'):
              assert a[key] == b[key], key
          assert 'KHR_texture_basisu' in b['extensionsRequired']
          assert 'KHR_materials_unlit' in b['extensionsRequired']
          image_views = {im['bufferView'] for im in a['images']}
          assert len(a['bufferViews']) == len(b['bufferViews'])
          for i, (old, new) in enumerate(zip(a['bufferViews'],b['bufferViews'])):
              if i in image_views:
                  continue
              x,y = old.get('byteOffset',0),new.get('byteOffset',0)
              assert ab[x:x+old['byteLength']] == bb[y:y+new['byteLength']], i
          for im in b['images']:
              view = b['bufferViews'][im['bufferView']]
              start = view.get('byteOffset',0)
              assert im['mimeType'] == 'image/ktx2'
              assert bb[start:start+12] == bytes.fromhex('ab4b5458203230bb0d0a1a0a')
          report = {'source_run':45665153041,'source_sha256':hashlib.sha256(Path('source-candidate/office-baked.glb').read_bytes()).hexdigest(),'compressed_sha256':hashlib.sha256(Path('compressed-candidate/office-baked-ktx2.glb').read_bytes()).hexdigest(),'non_image_buffer_views_verified':len(a['bufferViews'])-len(image_views),'geometry_and_material_metadata_unchanged':True,'image_count':len(b['images'])}
          Path('compressed-candidate/verification.json').write_text(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: office-hybrid-compressed-candidate
          path: compressed-candidate/
          if-no-files-found: error
          retention-days: 14
