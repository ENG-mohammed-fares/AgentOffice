name: Build and publish AgentOffice Windows EXE

on:
  push:
    branches: [main]
    paths:
      - 'AgentOffice-Source.zip'
      - 'release-version.txt'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agentoffice-windows-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract AgentOffice source
        shell: pwsh
        run: |
          if (-not (Test-Path './AgentOffice-Source.zip')) { throw 'Missing AgentOffice-Source.zip in repository root.' }
          New-Item -ItemType Directory -Path './app' -Force | Out-Null
          Expand-Archive -LiteralPath './AgentOffice-Source.zip' -DestinationPath './app' -Force
          if (-not (Test-Path './app/package.json')) { throw 'Source ZIP must contain package.json at its root.' }
          if (-not (Test-Path './app/electron/main.cjs')) { throw 'Source ZIP does not include Electron main entry.' }
          if (-not (Test-Path './app/electron-builder.config.cjs')) { throw 'Missing electron-builder.config.cjs.' }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python for approved logo conversion
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply approved logo and version to extracted source
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "Pillow>=11,<13"
          if ($LASTEXITCODE -ne 0) { throw 'Could not install Pillow.' }
          python scripts/apply-branding.py
          if ($LASTEXITCODE -ne 0) { throw 'Could not generate AgentOffice icons.' }
          if (-not (Test-Path './app/build/icon.ico')) { throw 'Missing icon.ico' }
          if (-not (Test-Path './app/public/icon.png')) { throw 'Missing app icon.png' }

      - name: Read and validate version
        id: app
        shell: pwsh
        run: |
          $version = node -p "require('./app/package.json').version"
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid release version: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building AgentOffice version $version"

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Build installer with explicit Electron Builder configuration
        working-directory: app
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: pwsh
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Vite build failed.' }
          npx electron-builder --config electron-builder.config.cjs --win nsis --x64 --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Electron Builder failed.' }
          Get-ChildItem ./release

      - name: Publish one complete GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v${{ steps.app.outputs.version }}'
          $version = '${{ steps.app.outputs.version }}'
          $all = @(gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw 'Could not query GitHub Releases.' }
          $matches = @($all | Where-Object { $_.tag_name -eq $tag })
          if (@($matches | Where-Object { -not $_.draft }).Count -gt 0) {
            throw "A published release already exists for $tag. Increase release-version.txt before publishing another update."
          }
          foreach ($draft in @($matches | Where-Object { $_.draft })) {
            Write-Host "Removing incomplete draft release $($draft.id) for $tag"
            gh api "repos/$env:GITHUB_REPOSITORY/releases/$($draft.id)" -X DELETE
            if ($LASTEXITCODE -ne 0) { throw "Could not clean draft $($draft.id)" }
          }
          $exe = @(Get-ChildItem './app/release' -Filter '*.exe' -File | Where-Object { $_.Name -like "AgentOffice-Setup-$version-*" })
          $blockmap = @(Get-ChildItem './app/release' -Filter '*.blockmap' -File)
          $metadata = './app/release/latest.yml'
          if ($exe.Count -ne 1 -or $blockmap.Count -lt 1 -or -not (Test-Path $metadata)) {
            throw 'Missing installer, blockmap, or latest.yml. See build output.'
          }
          $assets = @($exe[0].FullName, $metadata) + @($blockmap | ForEach-Object { $_.FullName })
          Write-Host "Publishing assets: $($assets -join ', ')"
          gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --title "AgentOffice $version" --notes "AgentOffice Desktop $version. Windows 64-bit installer with GitHub auto-update metadata. Early 3D prototype; AI agents are not implemented yet." --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publishing failed.' }

      - name: Verify published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $tag = 'v${{ steps.app.outputs.version }}'
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft,assets,url
          if ($LASTEXITCODE -ne 0) { throw "Failed to verify published release $tag" }

      - name: Save build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AgentOffice-Windows
          path: |
            app/release/*.exe
            app/release/latest.yml
            app/release/*.blockmap
          if-no-files-found: warn
