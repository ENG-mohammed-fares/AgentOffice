name: Office hybrid combined bake candidate

on:
  push:
    branches: ['perf/1.6.17-hybrid-baked']
    paths:
      - 'assets/agile-office/bake-office-candidate.py'
      - '.github/workflows/office-bake-candidate.yml'
      - 'assets/agile-office/build_scene.py'
      - 'assets/agile-office/export_glb.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: office-bake-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Generate the original office without changing its sources
        run: |
          python -m pip install --only-binary :all: "numpy==2.3.5" "scipy==1.17.0" "trimesh==4.11.1" "Pillow==12.3.0"
          python assets/agile-office/build_scene.py
          python assets/agile-office/export_glb.py
          python -m py_compile assets/agile-office/bake-office-candidate.py
      - name: Install Blender from the signed Ubuntu package repository
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y blender
          blender --version
      - name: Verify material classifier with Blender
        run: |
          blender --background --factory-startup --python-exit-code 1 --python-expr "import runpy; runpy.run_path('assets/agile-office/bake-office-candidate.py')['test_material_classification']()"
      - name: Bake static combined color atlas
        run: |
          mkdir -p office-candidates
          blender --background --factory-startup --python-exit-code 1 --python assets/agile-office/bake-office-candidate.py -- --source assets/agile-office/office.glb --layout assets/agile-office/scene.json --output office-candidates --samples 32 --atlas 2048 --combined
      - name: Verify atlas and candidate model
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root = Path("office-candidates")
          report = json.loads((root / "bake-report.json").read_text())
          assert report["mode"] == "combined" and report["baked_nodes"]
          with Image.open(root / "office-combined.png") as im:
              assert im.size == (2048, 2048)
              assert any(high > low for low, high in im.convert("RGB").getextrema())
          assert (root / "office-baked.glb").stat().st_size > 0
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: office-hybrid-review-candidate
          path: office-candidates/
          if-no-files-found: warn
          retention-days: 14
