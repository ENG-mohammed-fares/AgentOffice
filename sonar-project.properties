sonar.projectKey=ENG-mohammed-fares_AgentOffice
sonar.organization=eng-mohammed-fares
sonar.projectName=AgentOffice
sonar.sourceEncoding=UTF-8
# Analyze the actual prepared runtime source and build/CI scripts.
sonar.sources=app/src,app/electron,app/scripts,scripts,.github/workflows,assets/agile-office
sonar.tests=app/scripts,scripts
sonar.test.inclusions=app/scripts/**/*.test.*,app/scripts/auth-smoke.cjs,scripts/**/*.test.*
# The JS/CSS overlay is already copied into app/src and app/scripts; avoid double counting.
sonar.exclusions=app/scripts/**/*.test.*,app/scripts/auth-smoke.cjs,scripts/**/*.test.*,assets/agile-office/**/*.js,assets/agile-office/**/*.cjs,assets/agile-office/**/*.mjs,assets/agile-office/**/*.css,**/node_modules/**,**/dist/**,**/release/**,**/*.b64,**/*.glb,.git/**,coverage/**,**/*.zip,**/*.png,**/*.webp,**/*.ico,**/*.woff,**/*.woff2,**/*.ttf,**/*.wasm
# app/ is materialized by CI from the immutable baseline and overlays.
sonar.scm.exclusions.disabled=true
sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage/tooling-lcov.info
# Fail the scan if the actual Quality Gate fails or cannot be obtained.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
