sonar.projectKey=ENG-mohammed-fares_AgentOffice
sonar.organization=eng-mohammed-fares
sonar.projectName=AgentOffice
sonar.sourceEncoding=UTF-8
# Analyze the actual prepared runtime source and build/CI scripts.
sonar.sources=app/src,app/electron,app/scripts,scripts,.github/workflows,assets/agile-office,assets/crash-monitor
sonar.tests=app/scripts,scripts
sonar.test.inclusions=app/scripts/**/*.test.*,app/scripts/auth-smoke.cjs,app/scripts/crash-monitor-smoke.cjs,scripts/**/*.test.*,scripts/test_*.py,scripts/test-*.ps1,scripts/*.Tests.ps1,scripts/office-runtime-benchmark.cjs,scripts/refactoring-gate.mjs
# Analyze Git-tracked runtime overlays (canonical sources) rather than their byte-identical prepared copies.
# Keep baseline app files and all production scripts in analysis; generated test copies remain tests.
sonar.exclusions=app/scripts/**/*.test.*,app/scripts/auth-smoke.cjs,scripts/**/*.test.*,scripts/test_*.py,scripts/test-*.ps1,scripts/*.Tests.ps1,scripts/office-runtime-benchmark.cjs,scripts/refactoring-gate.mjs,app/src/main.js,app/src/agile-renderer.js,app/src/agile-office.css,app/src/office-performance.mjs,app/src/office-batching.mjs,app/src/office-tasks.mjs,app/src/office-task-panel.mjs,app/electron/crash-monitor.cjs,assets/agile-office/**/*.test.mjs,assets/crash-monitor/**/*.test.cjs,assets/crash-monitor/crash-monitor-smoke.cjs,app/scripts/crash-monitor-smoke.cjs,**/node_modules/**,**/dist/**,**/release/**,**/*.b64,**/*.glb,.git/**,coverage/**,**/*.zip,**/*.png,**/*.webp,**/*.ico,**/*.woff,**/*.woff2,**/*.ttf,**/*.wasm
# app/ is materialized by CI from the immutable baseline and overlays.
sonar.scm.exclusions.disabled=true
sonar.javascript.lcov.reportPaths=coverage/sonar-lcov.info,coverage/tooling-lcov.info
# Fail the scan if the actual Quality Gate fails or cannot be obtained.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Actual Python execution coverage; untested production files remain in scope.
sonar.python.coverage.reportPaths=coverage/python-coverage.xml

# Pester coverage converted from executed PowerShell command locations to generic line coverage.
sonar.coverageReportPaths=coverage/powershell-sonar.xml
