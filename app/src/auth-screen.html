e-height:1.1;margin:0 0 11px}.desc{font-size:14px;color:var(--muted);line-height:1.6;margin:0 0 27px}.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:24px;gap:24px}.tab{border:0;background:none;color:var(--muted);padding:0 0 11px;font-size:13px;font-weight:600;border-bottom:2px solid transparent}.tab.active{color:var(--text);border-bottom-color:var(--orange)}.field{margin-bottom:17px}.field label{display:block;font-size:13px;font-weight:600;margin-bottom:8px}.inputbox{display:flex;align-items:center;gap:10px;background:#212523;border:1px solid #414541;border-radius:7px;height:47px;padding:0 13px;transition:border-color .2s,box-shadow .2s}.inputbox:focus-within{border-color:var(--orange);box-shadow:0 0 0 3px #ef885019}.inputbox svg{width:17px;height:17px;flex-shrink:0;stroke:#8e958f;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.inputbox input{border:0;background:none;color:var(--text);outline:none;min-width:0;flex:1;font-size:14px;padding:0;height:100%}.inputbox input::placeholder{color:#777f79}.eye-button{padding:5px 0 5px 5px;border:0;background:none;display:grid;place-items:center}.remember{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin:0 0 21px;cursor:pointer}.remember input{accent-color:var(--deep);width:15px;height:15px;margin:0}.primary{height:47px;width:100%;background:#e67f46;color:#211a15;border:1px solid #f29664;border-radius:7px;font-weight:650;font-size:14px;transition:background .18s,transform .18s,box-shadow .18s;display:flex;justify-content:center;align-items:center;gap:9px}.primary:hover{background:#f19a65;box-shadow:0 5px 22px #e67f4629;transform:translateY(-1px)}.primary:active{transform:translateY(1px)}.primary svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.notice{border-top:1px solid var(--line);margin-top:24px;padding-top:17px;display:flex;align-items:flex-start;gap:8px;font-size:12px;color:#929892 /* Typography refinement — no layout or interaction changes. */
:root{font-family:"Segoe UI Variable Text","Segoe UI",Arial,sans-serif}
.brand-copy h1{font-weight:700;letter-spacing:-1.55px}
.brand-copy p{font-weight:400;letter-spacing:.08px;line-height:1.6}
.kicker{font-weight:600;letter-spacing:.22px}
h2{font-family:"Segoe UI Variable Display","Segoe UI",Arial,sans-serif;font-weight:650;letter-spacing:-1.1px}
.desc{font-weight:400;letter-spacing:.04px}
.field label,.tab{font-weight:600;letter-spacing:.05px}
.primary{font-weight:650;letter-spacing:.12px}
.appname{font-weight:600;letter-spacing:.08px}
.speech{font-weight:500;letter-spacing:.04px}

/* Final authentication polish: original artwork, palette and desktop shell retained. */
:root{--motion:cubic-bezier(.22,1,.36,1)}
.brand-copy h1{font-weight:650;letter-spacing:-1.35px}
.brand-copy{position:relative;margin-top:4px}
.speech{position:absolute;top:100%;left:50%;transform:translateX(-50%) translateY(5px);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 220ms ease,transform 280ms var(--motion);margin-top:18px}
.speech.visible{opacity:1;transform:translateX(-50%) translateY(0)}
.form{transition:transform 420ms var(--motion);padding:8px 0}
.form.submitting{transform:translateY(-24px)}
h2{font-size:32px;font-weight:600;letter-spacing:-.8px;margin:0 0 25px;line-height:1.2}
.tabs{position:relative;gap:26px;margin-bottom:27px;isolation:isolate}
.tab{border-bottom:0;padding:0 0 13px;transition:color 220ms ease;font-size:14px;font-weight:550}
.tab.active{color:var(--text);border-bottom-color:transparent}
.tab-indicator{position:absolute;bottom:-1px;left:0;height:2px;width:var(--tab-width,42px);transform:translateX(var(--tab-x,0px));background:var(--orange);border-radius:2px 2px 0 0;box-shadow:0 0 10px #ef885044;transition:transform 380ms var(--motion),width 380ms var(--motion);pointer-events:none}
.field label{font-weight:550}
.inputbox{position:relative;transition:transform 300ms var(--motion),border-color 220ms ease,box-shadow 300ms var(--motion),background 220ms ease}
.inputbox:focus-within{transform:translateY(-4px);border-color:var(--orange);background:#252724;box-shadow:0 0 0 2px #ef885024,0 0 18px #ef885037,0 7px 14px #0003}
.inputbox:focus-within>svg{stroke:var(--orange)}
.inputbox svg{transition:stroke 220ms ease}
.field-slot,.remember-slot{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows 380ms var(--motion),opacity 250ms ease;}
.field-slot.expanded,.remember-slot.expanded{grid-template-rows:1fr;opacity:1}

body {display:block; padding:0}
:root,body,.form h2,.brand-copy h1,.tab,.field label,button,input {font-family:NotoSans,NotoKufiArabic,sans-serif}
[lang=ar] body,[lang=ar] .form h2,[lang=ar] .field label,[lang=ar] button,[lang=ar] input {font-family:NotoKufiArabic,NotoSans,sans-serif;letter-spacing:normal}
[lang=ar] .form h2 {font-size:clamp(23px,2.2vw,30px);line-height:1.65}
.form h2 {font-weight:700}.field label{line-height:1.7}
.google-action {width:100%;display:flex;gap:10px;justify-content:center;align-items:center;min-height:46px;margin-top:12px;border-radius:8px;background:#fff;color:#202124;border:1px solid #a7a7a7;font-weight:600;font-size:14px}
.google-action:hover {background:#f4f6fa}.google-action:disabled {opacity:.68}
#guest {border-color:transparent;background:transparent;color:var(--muted)}
.back-link {display:block;margin:12px 0;padding:4px 0;background:none;border:0;color:var(--orange);font-weight:600;font-size:12px}
.entry {display:block;width:100%;height:48px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:0 14px}
.entry:focus {outline:2px solid var(--orange);outline-offset:2px}.entry.code {letter-spacing:.45em;text-align:center;font-size:20px}
#resetHelp {font-size:14px;color:var(--muted);line-height:1.75;overflow-wrap:anywhere;margin:8px 0 24px}
#recovery h2 {margin-bottom:0}
.recovery-progress {display:flex;gap:6px;margin:22px 0 16px}.recovery-progress i {width:26px;height:3px;border-radius:3px;background:var(--line)}
.recovery-progress i.active {background:var(--orange)}
.window,.light .window {width:100%;height:100dvh;min-height:0;border:0;border-radius:0;box-shadow:none;transform:none}
.titlebar {cursor:default;touch-action:auto}
.title-tools {margin-inline:0 8px}
.auth {display:flex;flex-direction:column;align-items:stretch;overflow:auto}
.form {margin:auto;flex:none;max-width:390px;width:100%}
.form.submitting,.inputbox:focus-within {transform:none}
.form::after {box-shadow:none;background:transparent;backdrop-filter:none}
.form::before {display:none}
.inputbox.invalid {border-color:#de8875}
.brand-copy p {min-height:0}
.field-slot:not(.expanded),[hidden] {display:none!important}
.guest-button {width:100%;margin-top:10px;min-height:42px;background:transparent;color:var(--text);border:1px solid var(--border);border-radius:8px;font-size:13px;font-weight:550}
.guest-button:hover {background:var(--surface-focus);border-color:var(--muted)}
.guest-button:disabled {opacity:.65}
.field .floating {pointer-events:none}
input[type=email],input[type=password],input.revealed {direction:ltr;text-align:start}
[dir=rtl] .inputbox input {text-align:right}
.title-tools button {min-width:36px;min-height:32px}
.form-status {line-height:1.55}
.tab-indicator {direction:ltr}
.brand .robot {pointer-events:none}
.bottom .local i {animation:none}
@media(max-width:760px) {
  .window,.light .window {height:auto;min-height:100dvh}
  .main {flex:1;grid-template-rows:auto 1fr}
  .brand {padding:14px 16px;min-height:116px;display:flex;flex-direction:row;gap:20px}
  .scene {width:100px;height:100px;flex:none}
  .brand-copy {margin:0;text-align:start}
  .brand-copy h1 {font-size:25px}
  .role-chip,.orbit-dot.second,.speech {display:none}
  .auth {padding:24px clamp(20px,7vw,48px);overflow:visible}
  .bottom .foot-right {display:none}
  .bottom {gap:12px}
}
@media(prefers-reduced-motion:reduce){.robot,.robot .eye {transition:none!important}.ring,.orbit-dot {animation:none!important}}

const resetInputs=['resetAddress','resetCode','resetNew','resetConfirm'];
function renderRecovery(){
  byId('loginPanel').hidden=step!==0;byId('recovery').hidden=step===0;
  byId('google').disabled=busy;byId('github').disabled=busy;byId('forgot').disabled=busy;
  byId('googleCancel').hidden=!googlePending;
  if(!step)return;
  byId('resetTitle').textContent=t(['','sendTitle','codeTitle','setTitle'][step]);
  byId('resetHelp').textContent=step===2?t('codeHelp')+' '+address+'.':t(step===1?'sendHelp':'setHelp');
  byId('resetNext').textContent=t(busy?'pending':['','send','verify','update'][step]);
  byId('resetAddressRow').hidden=step!==1;byId('resetCodeRow').hidden=step!==2;byId('resetPasswordRow').hidden=step!==3;
  byId('resetNext').disabled=busy||!online;byId('resetBack').disabled=busy;
  byId('resetResend').hidden=step!==2;
  byId('resetResend').disabled=busy||Date.now()<resendAt;
  byId('resetResend').textContent=t('resend')+(Date.now()<resendAt?' ('+Math.ceil((resendAt-Date.now())/1000)+')':'');
  byId('resetStatus').textContent=resetNotice?t(resetNotice):online?'':t('cloudOff');
  byId('resetStatus').classList.toggle('error',resetError);
  document.querySelectorAll('.recovery-progress i').forEach((el,i)=>el.classList.toggle('active',i<step));
  resetInputs.forEach(id=>byId(id).disabled=busy);
}
function resetView(next,notice=''){
  step=next;resetNotice=notice;resetError=false;
  if(step!==2){clearInterval(resendTimer);resendTimer=null}
  if(step===0){grant='';address='';resetInputs.forEach(id=>byId(id).value='')}
  render();requestAnimationFrame(()=>byId(step===0?'email':step===1?'resetAddress':step===2?'resetCode':'resetNew').focus());
}
function cooldown() {
  resendAt=Date.now()+60000;clearInterval(resendTimer);
  resendTimer=setInterval(()=>{renderRecovery();if(Date.now()>=resendAt)clearInterval(resendTimer)},1000);
}
function cloudError(err){
  const msg=String(err?.message||'');
  if(msg.includes('Too many'))return 'limit';
  if(msg.includes('expired code'))return 'expired';
  if(msg.includes('not configured'))return 'cloudOff';
  if(msg.includes('canceled')||msg.includes('sign-in expired'))return 'googleClosed';
  return 'cloudFail';
}
byId('forgot').onclick=()=>{
  if(busy)return;
  password.value='';password.type='password';password.classList.remove('revealed');syncField(password);
  byId('resetAddress').value=email.value;resetView(1);
};
byId('resetBack').onclick=()=>{if(!busy)resetView(0)};
async function signInOAuth(provider){
  if(busy)return;if(!online)return status('cloudOff',true);
  googlePending=busy=true;status('browser');render();
  try{const user=await session.auth[provider]();session.enter(user)}
  catch(err){status(cloudError(err),true)}
  finally{googlePending=busy=false;render()}
}
byId('google').onclick=()=>signInOAuth('google');
byId('github').onclick=()=>signInOAuth('github');
byId('googleCancel').onclick=()=>session?.auth?.cancelGoogle()?.catch(()=>{});
function report(key,id){
  resetNotice=key;resetError=true;renderRecovery();if(id)byId(id).focus();
}
byId('resetForm').onsubmit=async event=>{
  event.preventDefault();if(busy||!step)return;if(!online)return report('cloudOff');
  const input=byId('resetAddress'),code=byId('resetCode').value.trim().replace(/[٠-٩]/g,c=>String(c.charCodeAt(0)-0x660));
  if(step===1&&(!input.validity.valid||!/^\S+@[^\s@]+\.[^\s@]+$/.test(input.value.trim())))return report('invalidEmail','resetAddress');
  if(step===2&&!/^\d{6,10}$/.test(code))return report('expired','resetCode');
  if(step===3&&byId('resetNew').value.length<10)return report('short','resetNew');
  if(step===3&&byId('resetNew').value!==byId('resetConfirm').value)return report('mismatch','resetConfirm');
  busy=true;resetNotice='';renderRecovery();
  try{
    if(step===1){
      address=input.value.trim().toLowerCase();await session.auth.requestCode(address);cooldown();resetView(2);
    }else if(step===2){
      grant=await session.auth.verifyCode(address,code);byId('resetCode').value='';resetView(3);
    }else{
      await session.auth.resetPassword(grant,byId('resetNew').value);email.value=address;syncField(email);
      const verifiedAddress=address;
      resetView(0);status('savedPassword');
      session.passwordChanged?.(verifiedAddress);
    }
  }catch(err){
    const key=cloudError(err);
    if(step===3&&key==='expired'){grant='';resetView(1,'startOver')}else report(key);
  }finally{busy=false;render()}
};
byId('resetResend').onclick=async()=>{
  if(step!==2||busy||Date.now()<resendAt)return;busy=true;renderRecovery();
  try{await session.auth.requestCode(address);byId('resetCode').value='';resetNotice='sentAgain';resetError=false;cooldown()}
  catch(err){report(cloudError(err))}finally{busy=false;renderRecovery()}
};
for(const id of ['resetNew','resetConfirm']){
  byId(id).onfocus=password.onfocus;byId(id).onblur=password.onblur;
}
render();

</script></body></html>
