title = "AgentOffice secret detection"
[extend]
useDefault = true

# Allow only the reviewed public client key type in identity configuration.
# All other secret types and files remain subject to the default scanner.
[[allowlists]]
description = "Only Supabase public client keys in the reviewed identity configuration"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^app/electron/identity-config\.json$''', '''^AgentOffice-Source\.zip!electron/identity-config\.json$''', '''^electron[/\\]identity-config\.json$''']
regexes = ['''^sb_publishable_[A-Za-z0-9_-]{31}$''']
