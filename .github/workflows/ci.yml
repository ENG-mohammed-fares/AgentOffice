name: AgentOffice CI

on:
  push:
    branches-ignore: [development]
  pull_request:
  workflow_dispatch:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: agentoffice-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  office-ktx2:
    name: Build verified compressed office textures
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Generate office asset from versioned source
        run: |
          python -m pip install --only-binary :all: "numpy==2.3.5" "scipy==1.17.0" "trimesh==4.11.1" "Pillow==12.3.0" "coverage==7.10.7"
          python -m coverage run --branch --source=scripts,assets/agile-office assets/agile-office/build_scene.py
          python -m coverage run --append --branch --source=scripts,assets/agile-office assets/agile-office/export_glb.py
          mkdir -p compressed
      - name: Verify and install KTX Software 4.4.2
        run: |
          curl --proto '=https' --proto-redir '=https' -fL --retry 2 https://github.com/KhronosGroup/KTX-Software/releases/download/v4.4.2/KTX-Software-4.4.2-Linux-x86_64.deb -o "$RUNNER_TEMP/ktx.deb"
          echo "ca635ed489d8bf54fac8d7687056c651193de0740830a7738cc034adc63e3027  $RUNNER_TEMP/ktx.deb" | sha256sum -c -
          sudo apt-get install -y "$RUNNER_TEMP/ktx.deb"
      - name: Encode and validate actual base color maps
        run: |
          python -m coverage run --append --branch --source=scripts,assets/agile-office assets/agile-office/compress-ktx2.py assets/agile-office/office.glb compressed/office-ktx2.glb
          python -m coverage xml -o compressed/office-assets-coverage.xml
      - name: Measure actual Blender bake execution (review assets only)
        run: |
          sudo apt-get update
          # Blender uses the distribution Python, not actions/setup-python.
          sudo apt-get install --no-install-recommends -y blender python3-numpy python3-coverage
          export PYTHONPATH=/usr/lib/python3/dist-packages
          blender --version
          blender --background --factory-startup --python-use-system-env --python-exit-code 1 --python-expr "import sys, numpy, coverage; print('Blender Python:', sys.version, 'NumPy:', numpy.__version__, 'coverage:', coverage.__version__)"
          blender --background --factory-startup --python-use-system-env --python-exit-code 1 --python scripts/test_office_bake_execution.py
          test -s compressed/office-bake-coverage.xml
      - uses: actions/upload-artifact@v6
        with:
          name: agentoffice-compressed-textures
          path: compressed/
          if-no-files-found: error
          retention-days: 14

  windows-validation:
    needs: office-ktx2
    name: Windows build and tests
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify SonarCloud primary branch before building
        if: github.repository == 'ENG-mohammed-fares/AgentOffice' && (github.ref == 'refs/heads/development' || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'development' && github.event.pull_request.head.repo.full_name == github.repository))
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) { throw 'SONAR_TOKEN is required.' }
          try {
            $branches = Invoke-RestMethod -Uri 'https://sonarcloud.io/api/project_branches/list?project=ENG-mohammed-fares_AgentOffice' -Headers @{Authorization="Bearer $env:SONAR_TOKEN"}
          } catch { throw 'Cannot verify SonarCloud primary branch; check token access and service availability.' }
          $primary = @($branches.branches | Where-Object { $_.isMain -eq $true })
          if ($primary.Count -ne 1 -or $primary[0].name -ne 'development') {
            throw 'SonarCloud must use development as Main Branch on the Free plan. Align the project branch settings; do not bypass Quality Gate or change GitHub release branches.'
          }

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test release validation and collect Python coverage
        shell: pwsh
        run: |
          python -m pip install --only-binary :all: --disable-pip-version-check "coverage==7.10.7"
          if ($LASTEXITCODE -ne 0) { throw 'Coverage tooling installation failed.' }
          New-Item -ItemType Directory -Force coverage | Out-Null
          python -m coverage run --branch --source=scripts -m unittest discover -s scripts -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Release validation regression tests failed.' }
          python -m coverage xml -o coverage/python-coverage.xml
          if ($LASTEXITCODE -ne 0 -or !(Test-Path coverage/python-coverage.xml)) { throw 'Python coverage report missing.' }

      - name: Validate and extract source archive
        shell: pwsh
        run: |
          python -m coverage run --append --branch --source=scripts,assets/agile-office scripts/ci-prepare.py
          if ($LASTEXITCODE -ne 0) { throw 'Source archive validation failed.' }

      - name: Apply branding and authentication source
        shell: pwsh
        run: |
          python -m pip install --only-binary :all: --disable-pip-version-check "Pillow>=11,<13"
          if ($LASTEXITCODE -ne 0) { throw 'Pillow install failed.' }
          python -m coverage run --append --branch --source=scripts,assets/agile-office scripts/apply-branding.py
          if ($LASTEXITCODE -ne 0) { throw 'Branding failed.' }
          python -m coverage run --append --branch --source=scripts,assets/agile-office scripts/apply-auth.py
          if ($LASTEXITCODE -ne 0) { throw 'Authentication preparation failed.' }

      - name: Test installed intro font readiness and cancellation
        run: node --test scripts/intro-font-readiness.test.cjs

      - name: Build the authenticated office assets
        shell: pwsh
        run: |
          python -m pip install --only-binary :all: --disable-pip-version-check "numpy==2.3.5" "scipy==1.17.0" "trimesh==4.11.1" "Pillow==12.3.0"
          if ($LASTEXITCODE -ne 0) { throw 'Office dependency installation failed.' }
          python -m coverage run --append --branch --source=scripts,assets/agile-office scripts/apply-agile-office.py
          if ($LASTEXITCODE -ne 0) { throw 'Office asset preparation failed.' }

      - name: Bundle the verified compressed asset
        uses: actions/download-artifact@v7
        with:
          name: agentoffice-compressed-textures
          path: app/public/office
      - name: Import geometry-build execution coverage
        shell: pwsh
        run: |
          Move-Item app/public/office/office-assets-coverage.xml coverage/office-assets-coverage.xml
          Move-Item app/public/office/office-bake-coverage.xml coverage/office-bake-coverage.xml
      - name: Validate compressed and original geometry
        run: python -m coverage run --append --branch --source=scripts,assets/agile-office assets/agile-office/verify-ktx2.py app/public/office

      - name: Install local crash monitoring
        run: python -m coverage run --append --branch --source=scripts,assets/agile-office scripts/apply-crash-monitor.py

      - name: Apply reviewed quality fixes and execution instrumentation
        run: python -m coverage run --append --branch --source=scripts,assets/agile-office scripts/apply-quality-fixes.py

      - name: Install locked coverage conversion tooling
        working-directory: scripts/coverage-tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify execution coverage conversion with real V8 fixtures
        run: node --test --experimental-test-coverage "--test-coverage-include=scripts/coverage-tools/convert.cjs" --test-reporter=spec --test-reporter-destination=stdout --test-reporter=lcov --test-reporter-destination=coverage/execution-tooling-lcov.info scripts/execution-coverage.test.cjs

      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          $files = Get-ChildItem ./app/src, ./app/electron, ./app/scripts -Recurse -File | Where-Object { $_.Extension -in '.js', '.cjs', '.mjs' }
          foreach ($file in $files) {
            node --check $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Syntax check failed: $($file.FullName)" }
          }

      - name: Refactoring Quality Gate
        run: node --experimental-vm-modules scripts/refactoring-gate.mjs

      - name: Upload refactoring verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agentoffice-refactoring-report
          path: refactoring-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Install dependencies
        working-directory: app
        shell: pwsh
        run: |
          if (Test-Path '../package-lock.json') {
            Copy-Item ../package-lock.json ./package-lock.json -Force
          }
          if (Test-Path './package-lock.json') {
            'true' | Set-Content -Encoding ascii ../ci-lock-present.txt
            npm ci --no-audit --no-fund
          } else {
            'false' | Set-Content -Encoding ascii ../ci-lock-present.txt
            npm install --no-audit --no-fund
          }
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed.' }

      - name: Upload resolved dependency lock
        uses: actions/upload-artifact@v6
        with:
          name: agentoffice-dependency-lock
          path: app/package-lock.json
          if-no-files-found: error
          retention-days: 30

      - name: Validate coverage reporter and measure tooling coverage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force coverage | Out-Null
          Remove-Item Env:NODE_V8_COVERAGE -ErrorAction SilentlyContinue
          node --test --experimental-test-coverage "--test-coverage-include=scripts/run-coverage.cjs" --test-reporter=spec --test-reporter-destination=stdout --test-reporter=lcov --test-reporter-destination=coverage/tooling-lcov.info scripts/coverage-report.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Coverage reporter tests failed.' }
          if (!(Test-Path coverage/tooling-lcov.info)) { throw 'Tooling LCOV missing.' }
          if (!(Select-String -Path coverage/tooling-lcov.info -Pattern '^SF:.*run-coverage\.cjs$' -Quiet)) { throw 'Coverage runner missing from tooling report.' }

      - name: Unit tests with production-source code coverage
        run: node scripts/run-coverage.cjs

      - name: Verify canonical overlay provenance and map actual coverage
        run: node scripts/run-coverage.cjs --canonicalize

      - name: Upload code coverage reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agentoffice-code-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 30

      - name: Package local KTX2 transcoder
        working-directory: app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force public/basis | Out-Null
          Copy-Item node_modules/three/examples/jsm/libs/basis/basis_transcoder.js public/basis/
          Copy-Item node_modules/three/examples/jsm/libs/basis/basis_transcoder.wasm public/basis/

      # Isolated review only: neither downloaded candidate nor captures are packaged.
      - name: Render actual seated avatars and separately movable chairs
        if: (github.ref == 'refs/heads/feat/1.6.17-natural-office-motion' || github.ref == 'refs/heads/feat/1.6.17-character-integration' || github.ref == 'refs/heads/development' || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'development' && github.event.pull_request.head.repo.full_name == github.repository))
        working-directory: app
        shell: pwsh
        env:
          AGENTOFFICE_CHARACTER_REVIEW: '1'
          AGENTOFFICE_SEATED_REVIEW: '1'
          AGENTOFFICE_GRAPHICS_PRESET: 'performance'
        run: |
          $env:AGENTOFFICE_PREVIEW_DIR = Join-Path $PWD '../seated-review'
          npx --no-install electron ../scripts/office-runtime-benchmark.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Actual seated character review failed' }
      - name: Preserve seated office screenshots
        if: always() && (github.ref == 'refs/heads/feat/1.6.17-natural-office-motion' || github.ref == 'refs/heads/feat/1.6.17-character-integration' || github.ref == 'refs/heads/development' || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'development' && github.event.pull_request.head.repo.full_name == github.repository))
        uses: actions/upload-artifact@v6
        with:
          name: office-seated-character-review
          path: seated-review/
          if-no-files-found: warn
          retention-days: 14

      # A previously baked model has different chair topology. Never reuse it as a release asset.


      - name: Source-mapped execution coverage build
        working-directory: app
        run: npm run build --ignore-scripts -- --sourcemap --minify false

      - name: Check renderer benchmark syntax
        run: node --check scripts/office-runtime-benchmark.cjs

      # Hosted runners may use software graphics. Enable only to collect a CI
      # renderer report; a Windows reference-device benchmark is still required.
      - name: Optional Electron renderer benchmark
        if: ${{ vars.AGENTOFFICE_RUN_RENDER_BENCHMARK == 'true' }}
        working-directory: app
        shell: pwsh
        env:
          AGENTOFFICE_PERF_REPORT: ${{ github.workspace }}/office-performance-report.json
          AGENTOFFICE_REQUIRE_KTX2: '1'
        run: npx --no-install electron ../scripts/office-runtime-benchmark.cjs

      - name: Upload optional renderer benchmark report
        if: ${{ always() && vars.AGENTOFFICE_RUN_RENDER_BENCHMARK == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: agentoffice-renderer-performance
          path: office-performance-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Electron authentication smoke tests
        working-directory: app
        env:
          NODE_V8_COVERAGE: ${{ github.workspace }}/coverage/runtime-v8
          AGENTOFFICE_EXECUTION_COVERAGE: ${{ github.workspace }}/coverage/runtime-renderer
        run: npx --no-install electron scripts/auth-smoke.cjs

      - name: Import actual Electron execution coverage
        shell: pwsh
        run: |
          node scripts/coverage-tools/convert.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Execution coverage conversion failed.' }
          Get-ChildItem app/dist -Recurse -Filter *.map | Remove-Item

      - name: Rebuild the original optimized production bundle
        working-directory: app
        run: npm run build --ignore-scripts

      - name: Verify final production bundle with the real authentication smoke test
        working-directory: app
        run: npx --no-install electron scripts/auth-smoke.cjs

      - name: Real Electron crash monitoring smoke test
        working-directory: app
        run: npx --no-install electron scripts/crash-monitor-smoke.cjs

      - name: Package tested Windows build (no publishing)
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GITHUB_REPOSITORY: ${{ github.repository }}
          AGENTOFFICE_REPO: ENG-mohammed-fares/AgentOffice
        run: npx --no-install electron-builder --config electron-builder.config.cjs --win nsis --x64 --publish never

      - name: Verify packaged public update feed
        run: python scripts/verify-update-feed.py

      - name: Scan packaged application for secrets
        shell: pwsh
        run: ./scripts/scan-packaged-secrets.ps1

      - name: Test Windows code-signing verification policy
        shell: pwsh
        run: ./scripts/test-code-signing.ps1

      - name: Test signing, publication guards and real packaged scan with PowerShell coverage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Get-Module -ListAvailable Pester | Where-Object Version -eq '5.7.1')) {
            Install-Module Pester -RequiredVersion 5.7.1 -Repository PSGallery -Scope CurrentUser -Force
          }
          Import-Module Pester -RequiredVersion 5.7.1 -Force
          $config = New-PesterConfiguration
          $config.Run.Path = @('./scripts/release-coverage.Tests.ps1')
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'
          $config.CodeCoverage.Enabled = $true
          $config.CodeCoverage.Path = @('./scripts/verify-code-signing.ps1','./scripts/publish-public-update.ps1','./scripts/scan-packaged-secrets.ps1')
          $config.CodeCoverage.OutputFormat = 'Cobertura'
          $config.CodeCoverage.OutputPath = 'coverage/powershell-cobertura.xml'
          $result = Invoke-Pester -Configuration $config
          if ($result.Result -ne 'Passed' -or $result.PassedCount -lt 7) { throw 'PowerShell verification tests did not pass.' }
          if (!(Test-Path 'coverage/powershell-cobertura.xml')) { throw 'Missing PowerShell coverage report.' }
          [xml]$raw = Get-Content 'coverage/powershell-cobertura.xml' -Raw
          $expected = @('verify-code-signing.ps1','publish-public-update.ps1','scan-packaged-secrets.ps1')
          $observed = @{}
          foreach ($class in $raw.SelectNodes('//class')) {
            $name = [IO.Path]::GetFileName(($class.GetAttribute('filename') -replace '\\','/'))
            if ($name -notin $expected) { throw "Unexpected PowerShell coverage file: $name" }
            if (!$observed.ContainsKey($name)) { $observed[$name] = @{} }
            foreach ($line in $class.SelectNodes('lines/line')) {
              $n = [int]$line.GetAttribute('number')
              $hits = [int]$line.GetAttribute('hits')
              if ($n -lt 1 -or $hits -lt 0) { throw 'Invalid Pester line evidence.' }
              if (!$observed[$name].ContainsKey($n) -or $hits -gt $observed[$name][$n]) { $observed[$name][$n] = $hits }
            }
          }
          $xml = [xml]'<coverage version="1"/>'
          foreach ($name in $expected) {
            if (!$observed.ContainsKey($name) -or !$observed[$name].Count -or !($observed[$name].Values | Where-Object { $_ -gt 0 })) { throw "Missing executed PowerShell coverage: $name" }
            $file = $xml.CreateElement('file')
            $file.SetAttribute('path', "scripts/$name")
            foreach ($n in ($observed[$name].Keys | Sort-Object)) {
              $line = $xml.CreateElement('lineToCover')
              $line.SetAttribute('lineNumber', [string]$n)
              $line.SetAttribute('covered', [string]($observed[$name][$n] -gt 0).ToString().ToLowerInvariant())
              [void]$file.AppendChild($line)
            }
            [void]$xml.DocumentElement.AppendChild($file)
          }
          $xml.Save((Join-Path $PWD 'coverage/powershell-sonar.xml'))

      - name: Upload PowerShell execution coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agentoffice-powershell-coverage
          path: coverage/powershell-*.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Prepare candidate manifest and verify update metadata
        shell: pwsh
        run: python -m coverage run --append --branch --source=scripts,assets/agile-office scripts/release-candidate.py create

      - name: Upload Windows candidate for QA
        uses: actions/upload-artifact@v6
        with:
          name: agentoffice-windows-candidate
          path: candidate/
          if-no-files-found: error
          retention-days: 30

      - name: Dependency security audit (blocking high and critical)
        working-directory: app
        run: npm audit --audit-level=high

      - name: Require committed dependency lock for release eligibility
        shell: pwsh
        run: |
          if ((Get-Content ./ci-lock-present.txt -Raw).Trim() -ne 'true') {
            throw 'Commit the reviewed package-lock.json from the dependency-lock artifact before release.'
          }

      - name: Refresh actual Python execution report
        run: python -m coverage xml -o coverage/python-coverage.xml

      - name: Preserve combined execution evidence
        uses: actions/upload-artifact@v6
        with:
          name: agentoffice-combined-coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 30

      - name: Require SonarCloud credentials for trusted development analysis
        if: github.repository == 'ENG-mohammed-fares/AgentOffice' && (github.ref == 'refs/heads/development' || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'development' && github.event.pull_request.head.repo.full_name == github.repository))
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PRIVATE_SOURCE: ${{ github.event.repository.private }}
          SONAR_PRIVATE_CONFIRMED: ${{ vars.AGENTOFFICE_SONAR_PRIVATE_CONFIRMED }}
        run: |
          if ($env:PRIVATE_SOURCE -eq 'true' -and $env:SONAR_PRIVATE_CONFIRMED -ne 'true') {
            throw 'Private source: verify SonarCloud project visibility and set AGENTOFFICE_SONAR_PRIVATE_CONFIRMED=true before analysis.'
          }
          if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) {
            throw 'SONAR_TOKEN is required for development Quality Gate.'
          }
          $requiredReports = @('coverage/sonar-lcov.info','coverage/tooling-lcov.info','coverage/execution-lcov.info','coverage/execution-tooling-lcov.info','coverage/python-coverage.xml','coverage/office-assets-coverage.xml','coverage/office-bake-coverage.xml','coverage/powershell-sonar.xml')
          foreach ($report in $requiredReports) {
            if (!(Test-Path $report -PathType Leaf) -or (Get-Item $report).Length -eq 0) { throw "Required measured coverage report missing or empty: $report" }
          }
          $actual = (Get-FileHash app/scripts/collect-renderer.cjs -Algorithm SHA256).Hash
          $canonical = (Get-FileHash scripts/coverage-tools/collect-renderer.cjs -Algorithm SHA256).Hash
          if ($actual -ne $canonical) { throw 'Generated Electron test collector is not identical to its source.' }

      - name: SonarCloud analysis and blocking Quality Gate
        id: sonar_scan
        if: github.repository == 'ENG-mohammed-fares/AgentOffice' && (github.ref == 'refs/heads/development' || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'development' && github.event.pull_request.head.repo.full_name == github.repository))
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      # Read-only diagnostics on the trusted PR; the failed blocking gate remains failed.
      - name: Report exact failed Sonar conditions and affected source locations
        if: failure() && steps.sonar_scan.outcome == 'failure' && github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'development' && github.event.pull_request.head.repo.full_name == github.repository && github.repository == 'ENG-mohammed-fares/AgentOffice'
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PR: ${{ github.event.pull_request.number }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SONAR_PR -notmatch '^[0-9]+$') { throw 'Invalid PR number' }
          $project = 'ENG-mohammed-fares_AgentOffice'
          $base = 'https://sonarcloud.io/api/'
          $headers = @{ Authorization = "Bearer $env:SONAR_TOKEN" }
          $pr = $env:SONAR_PR
          try {
            $status = Invoke-RestMethod -Uri "${base}qualitygates/project_status?projectKey=$project&pullRequest=$pr" -Headers $headers -TimeoutSec 30
            $status.projectStatus.conditions | Select-Object metricKey,status,actualValue,errorThreshold | ConvertTo-Json -Depth 4
          } catch { Write-Warning 'Quality condition details unavailable from Sonar API.' }
          try {
            $issues = Invoke-RestMethod -Uri "${base}issues/search?componentKeys=$project&pullRequest=$pr&resolved=false&ps=100" -Headers $headers -TimeoutSec 30
            $issues.issues | Select-Object rule,component,line,type,severity,impacts | ConvertTo-Json -Depth 6
            Write-Host "Sonar unresolved issues returned: $($issues.issues.Count) of $($issues.total)"
          } catch { Write-Warning 'Issue locations unavailable from Sonar API.' }
          try {
            $metrics = 'new_coverage,new_lines_to_cover,new_uncovered_lines,new_duplicated_lines_density'
            $measures = Invoke-RestMethod -Uri "${base}measures/component_tree?component=$project&pullRequest=$pr&metricKeys=$metrics&qualifiers=FIL&ps=500" -Headers $headers -TimeoutSec 30
            $measures.components | Select-Object path,measures | ConvertTo-Json -Depth 6
          } catch { Write-Warning 'File-level measures unavailable from Sonar API.' }
