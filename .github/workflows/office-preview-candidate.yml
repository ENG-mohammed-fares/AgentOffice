name: Prepare Full HD office preview candidates
on:
  push:
    branches: ['perf/1.6.17-baked-compression']
    paths:
      - '.github/workflows/office-preview-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          name: office-lighting-review-candidates
          run-id: 45663724718
          github-token: ${{ github.token }}
          path: rendered
      - name: Verify and prepare application-compatible preview candidates
        run: |
          python -m pip install --only-binary :all: "Pillow==12.3.0"
          python - <<'PY'
          import base64, hashlib, io, json
          from pathlib import Path
          from PIL import Image
          source = Path('rendered')
          original = Path('assets/agile-office')
          output = Path('preview-candidate')
          output.mkdir()
          records = []
          for i in range(3):
              name = f'view-{i}.webp'
              png = source / f'view-{i}.png'
              data = (source / name).read_bytes()
              old = base64.b64decode((original / (name + '.b64')).read_text().strip(), validate=True)
              with Image.open(png) as image:
                  image.load()
                  assert image.size == (1920, 1080)
                  assert any(low < high for low, high in image.convert('RGB').getextrema())
              with Image.open(io.BytesIO(data)) as image:
                  image.load()
                  assert image.format == 'WEBP' and image.size == (1920, 1080)
              with Image.open(io.BytesIO(old)) as image:
                  old_size = list(image.size)
              (output / name).write_bytes(data)
              (output / (name + '.b64')).write_text(base64.b64encode(data).decode('ascii') + '\n', encoding='ascii')
              records.append({'file':name,'original_size':old_size,'candidate_size':[1920,1080],'old_bytes':len(old),'new_bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'source_png_sha256':hashlib.sha256(png.read_bytes()).hexdigest()})
          (output / 'preview-review.json').write_text(json.dumps({'source_run':45663724718,'status':'review_only','views':records},indent=2))
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: office-fullhd-preview-source-candidates
          path: preview-candidate/
          if-no-files-found: error
          retention-days: 14
