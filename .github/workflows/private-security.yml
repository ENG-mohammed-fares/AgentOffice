name: AgentOffice private repository security

on:
  pull_request:
    branches: [development, main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: private-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-security:
    name: Local secrets and security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          version=8.24.3
          archive="gitleaks_${version}_linux_x64.tar.gz"
          sums="gitleaks_${version}_checksums.txt"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --retry 2 "$base/$archive" -o "$archive"
          curl --fail --silent --show-error --location --retry 2 "$base/$sums" -o "$sums"
          grep -E "^[a-f0-9]{64}  ${archive}$" "$sums" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks version
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Scan fetched Git history for secrets (redacted)
        run: gitleaks git --log-opts=--all --redact=100 --no-banner --max-decode-depth=1 --timeout=180 .

      - name: Scan checked-out files and nested archives (redacted)
        run: gitleaks dir --redact=100 --no-banner --max-archive-depth=2 --max-decode-depth=1 --timeout=180 .

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Extract verified runtime source for static checks
        run: python scripts/ci-prepare.py

      - name: Install pinned Semgrep Community Edition
        run: python -m pip install --disable-pip-version-check semgrep==1.126.0

      - name: Scan source with local security rules
        env:
          SEMGREP_SEND_METRICS: 'off'
        run: |
          semgrep scan --config .github/security/semgrep.yml --metrics=off --disable-version-check --error --strict --no-git-ignore app/electron app/src scripts assets
