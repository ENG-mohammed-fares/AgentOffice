name: CI timing baseline

on:
  workflow_dispatch:
  schedule:
    - cron: '13 3 * * *'

permissions:
  contents: read
  actions: read

jobs:
  timings:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify timing calculations
        run: python -m unittest discover -s scripts -p test_ci_timing_report.py
      - name: Collect last 30 completed runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/ci_timing_report.py --repository "$GITHUB_REPOSITORY" --output ci-timings.json --limit 30
      - uses: actions/upload-artifact@v6
        with:
          name: ci-timing-baseline
          path: ci-timings.json
          if-no-files-found: error
          retention-days: 30
