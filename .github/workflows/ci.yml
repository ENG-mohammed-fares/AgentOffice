name: AgentOffice CI

on:
  push:
    branches-ignore: [development]
  pull_request:
  workflow_dispatch:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: agentoffice-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-validation:
    name: Windows build and tests
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate and extract source archive
        shell: pwsh
        run: |
          python scripts/ci-prepare.py
          if ($LASTEXITCODE -ne 0) { throw 'Source archive validation failed.' }

      - name: Apply branding and authentication source
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "Pillow>=11,<13"
          if ($LASTEXITCODE -ne 0) { throw 'Pillow install failed.' }
          python scripts/apply-branding.py
          if ($LASTEXITCODE -ne 0) { throw 'Branding failed.' }
          python scripts/apply-auth.py
          if ($LASTEXITCODE -ne 0) { throw 'Authentication preparation failed.' }

      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          $files = Get-ChildItem ./app/src, ./app/electron, ./app/scripts -Recurse -File | Where-Object { $_.Extension -in '.js', '.cjs', '.mjs' }
          foreach ($file in $files) {
            node --check $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Syntax check failed: $($file.FullName)" }
          }

      - name: Install dependencies
        working-directory: app
        shell: pwsh
        run: |
          if (Test-Path '../package-lock.json') {
            Copy-Item ../package-lock.json ./package-lock.json -Force
          }
          if (Test-Path './package-lock.json') {
            'true' | Set-Content -Encoding ascii ../ci-lock-present.txt
            npm ci --no-audit --no-fund
          } else {
            'false' | Set-Content -Encoding ascii ../ci-lock-present.txt
            npm install --no-audit --no-fund
          }
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed.' }

      - name: Upload resolved dependency lock
        uses: actions/upload-artifact@v6
        with:
          name: agentoffice-dependency-lock
          path: app/package-lock.json
          if-no-files-found: error
          retention-days: 30

      - name: Unit tests and production-module V8 coverage
        shell: pwsh
        run: |
          node --test-reporter=spec --test-reporter-destination=stdout --test-reporter=lcov --test-reporter-destination=lcov.info --experimental-test-coverage --test-coverage-include='**/electron/auth.cjs' --test-coverage-include='**/electron/identity.cjs' --test-coverage-include='**/electron/startup-update.cjs' --test-coverage-include='**/electron/update-policy.cjs' --test app/scripts/identity.test.cjs tests/unit/auth.test.cjs tests/unit/identity-errors.test.cjs | Tee-Object -FilePath unit-coverage.txt
          $exitCode = $LASTEXITCODE
          if (Test-Path unit-coverage.txt) { Get-Content unit-coverage.txt | Add-Content -Path $env:GITHUB_STEP_SUMMARY }
          if ($exitCode -ne 0) { throw 'Unit tests failed.' }

      - name: Upload unit test coverage baseline
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agentoffice-unit-coverage
          path: |
            unit-coverage.txt
            lcov.info
          if-no-files-found: warn
          retention-days: 30

      - name: Check SonarCloud configuration
        id: sonar-config
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_REQUIRED: ${{ vars.SONAR_REQUIRED }}
          TRUSTED_RUN: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          $ready = $env:TRUSTED_RUN -eq 'true' -and $env:SONAR_TOKEN -and $env:SONAR_ORGANIZATION -and $env:SONAR_PROJECT_KEY
          if ($ready) {
            foreach ($key in @($env:SONAR_ORGANIZATION,$env:SONAR_PROJECT_KEY)) {
              if ($key -notmatch '^[A-Za-z0-9_.:-]+$') { throw 'Invalid SonarCloud key.' }
            }
            if (!(Test-Path lcov.info) -or !(Select-String -Path lcov.info -Pattern '^SF:' -Quiet)) { throw 'Missing LCOV source records.' }
            'enabled=true' >> $env:GITHUB_OUTPUT
          } else {
            'enabled=false' >> $env:GITHUB_OUTPUT
            if ($env:SONAR_REQUIRED -eq 'true' -and $env:TRUSTED_RUN -eq 'true') { throw 'Required SonarCloud configuration is missing.' }
            Write-Host 'SonarCloud not configured or untrusted PR; scan skipped.'
          }

      - name: SonarCloud static analysis and coverage
        if: steps.sonar-config.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=${{ vars.SONAR_REQUIRED == 'true' }}
            -Dsonar.qualitygate.timeout=300

      - name: Production Vite build
        working-directory: app
        run: npm run build --ignore-scripts

      - name: Electron authentication smoke tests
        working-directory: app
        run: npx --no-install electron scripts/auth-smoke.cjs

      - name: Package tested Windows build (no publishing)
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npx --no-install electron-builder --config electron-builder.config.cjs --win nsis --x64 --publish never

      - name: Prepare candidate manifest and verify update metadata
        shell: pwsh
        run: python scripts/release-candidate.py create

      - name: Upload Windows candidate for QA
        uses: actions/upload-artifact@v6
        with:
          name: agentoffice-windows-candidate
          path: candidate/
          if-no-files-found: error
          retention-days: 30

      - name: Dependency security audit (blocking high and critical)
        working-directory: app
        run: npm audit --audit-level=high

      - name: Require committed dependency lock for release eligibility
        shell: pwsh
        run: |
          if ((Get-Content ./ci-lock-present.txt -Raw).Trim() -ne 'true') {
            throw 'Commit the reviewed package-lock.json from the dependency-lock artifact before release.'
          }
