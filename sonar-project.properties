sonar.projectKey=ENG-mohammed-fares_AgentOffice
sonar.organization=eng-mohammed-fares
sonar.projectName=AgentOffice
sonar.sourceEncoding=UTF-8
# The shipped source archive is extracted by CI before scanning.
sonar.sources=app/src,app/electron,app/scripts,scripts,.github/workflows
sonar.tests=tests,app/scripts
sonar.test.inclusions=tests/**/*.cjs,app/scripts/**/*.test.cjs,app/scripts/auth-smoke.cjs
sonar.exclusions=app/scripts/**/*.test.cjs,app/scripts/auth-smoke.cjs,**/node_modules/**,**/dist/**,**/release/**
# Extracted files may be ignored by git; do not silently omit them.
sonar.scm.exclusions.disabled=true
sonar.javascript.lcov.reportPaths=lcov.info
