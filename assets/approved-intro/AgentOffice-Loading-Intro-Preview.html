function render(t){t=Math.min(3,Math.max(0,t));let a=part(t,0,.42),b=part(t,.08,.6),m=part(t,.55,1),r=part(t,.12,.43)*(1-part(t,.63,.96)),o=part(t,1.05,1.75);$('.brand').style.top=(43-4*m)+'%';$('.logo').style.opacity=.42+.58*a;$('.logo').style.transform=`scale(${.94+.06*b})`;$('.logo').style.filter=`blur(${(1-a)*4}px) drop-shadow(0 12px 24px #0003)`;$('.halo').style.opacity=.32+.63*a-.30*m;$('.ring').style.opacity=r;$('.ring').style.transform=`rotate(${-38+78*part(t,.12,.86)}deg)`;$('.office').style.opacity=o;$('.office').style.transform=`translateY(${(1-o)*8}px)`;$('.loading').style.opacity=part(t,.65,.98);$('#prep').style.opacity=1-part(t,1.93,2.12);$('#agents').style.opacity=part(t,1.93,2.12)*(1-part(t,2.64,2.82));$('#ready').style.opacity=part(t,2.64,2.82);$('.fill').style.width=100*progress(t)+'%'}let id=0;function play(){cancelAnimationFrame(id);document.body.classList.remove('complete');let start=performance.now();function step(now){let t=Math.min(3,(now-start)/1000);render(t);if(t<3)id=requestAnimationFrame(step);else{document.body.classList.add('complete');window.dispatchEvent(new Event('agentoffice:intro-complete'))}}render(0);id=requestAnimationFrame(step)}window.renderIntro=render;window.playIntro=play;$('#replay').onclick=play;render(0);if(!new URLSearchParams(location.search).has('frame'))play();</script></body></html>
