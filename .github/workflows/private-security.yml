name: AgentOffice private repository security

on:
  pull_request:
    branches: [development, main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: private-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-security:
    name: Local secrets and security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify secure dependency download policy
        run: python3 -m unittest discover -s scripts -p test_workflow_downloads.py -v
      - name: Install pinned Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location --retry 2 "$base/$archive" -o "$archive"
          printf "%s  %s\n" "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks version
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Test narrow publishable-key exception
        shell: bash
        run: |
          set -euo pipefail
          config="$GITHUB_WORKSPACE/.github/security/gitleaks.toml"
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          cd "$fixture"
          mkdir -p app/electron
          python3 -c 'import json,secrets,pathlib,zipfile; value=json.dumps({"publishableKey":"sb_"+"publishable_"+secrets.token_hex(16)[:31]}); pathlib.Path("app/electron/identity-config.json").write_text(value); z=zipfile.ZipFile("AgentOffice-Source.zip","w"); z.writestr("electron/identity-config.json",value); z.close()'
          gitleaks dir --config "$config" --redact=100 --no-banner --max-archive-depth=2 .
          python3 -c 'import json,secrets,pathlib; pathlib.Path("app/electron/identity-config.json").write_text(json.dumps({"publishableKey":"sb_"+"secret_"+secrets.token_hex(24)}))'
          status=0
          gitleaks dir --config "$config" --redact=100 --no-banner --max-archive-depth=2 . || status=$?
          test "$status" -eq 1

      - name: Scan fetched Git history for secrets (redacted)
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/gitleaks-history.json"
          trap 'rm -f "$report"' EXIT
          status=0
          gitleaks git --config .github/security/gitleaks.toml --log-opts=--all --redact=100 --no-banner --max-decode-depth=1 --timeout=180 --report-format=json --report-path="$report" . || status=$?
          if [ -f "$report" ]; then
            python3 -c 'import json,sys; rows=json.load(open(sys.argv[1],encoding="utf-8")) or []; print(json.dumps([{"rule":x.get("RuleID"),"file":x.get("File"),"line":x.get("StartLine"),"commit":x.get("Commit")} for x in rows],ensure_ascii=True))' "$report"
          fi
          exit "$status"

      - name: Scan checked-out files and nested archives (redacted)
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/gitleaks-tree.json"
          trap 'rm -f "$report"' EXIT
          status=0
          gitleaks dir --config .github/security/gitleaks.toml --redact=100 --no-banner --max-archive-depth=2 --max-decode-depth=1 --timeout=180 --report-format=json --report-path="$report" . || status=$?
          if [ -f "$report" ]; then
            python3 -c 'import json,sys; rows=json.load(open(sys.argv[1],encoding="utf-8")) or []; print(json.dumps([{"rule":x.get("RuleID"),"file":x.get("File"),"line":x.get("StartLine"),"commit":x.get("Commit")} for x in rows],ensure_ascii=True))' "$report"
          fi
          exit "$status"

      - uses: actions/setup-python@v6
        if: success() || failure()
        with:
          python-version: '3.12'

      - name: Extract verified runtime source for static checks
        if: success() || failure()
        run: python scripts/ci-prepare.py

      - name: Install pinned Semgrep Community Edition
        if: success() || failure()
        run: |
          python -m pip install --only-binary :all: --disable-pip-version-check setuptools==80.9.0 semgrep==1.126.0

      - name: Scan source with local security rules
        if: success() || failure()
        env:
          SEMGREP_SEND_METRICS: 'off'
        run: |
          semgrep scan --config .github/security/semgrep.yml --metrics=off --disable-version-check --error --strict --no-git-ignore app/electron app/src scripts assets
