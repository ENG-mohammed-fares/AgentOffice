name: AgentOffice Development CI/CD

on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentoffice-development-release
  cancel-in-progress: false

jobs:
  ci:
    name: Validate and build
    if: github.ref == 'refs/heads/development' && github.repository == 'ENG-mohammed-fares/AgentOffice'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  verify:
    name: Verify exact tested candidate
    needs: ci
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      eligible: ${{ steps.verify.outputs.eligible }}
      version: ${{ steps.verify.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          name: agentoffice-windows-candidate
          path: candidate
      - name: Check commit, version, lockfile and hashes
        id: verify
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content release-version.txt -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version.' }
          $env:EXPECTED_VERSION = $version
          python scripts/release-candidate.py verify
          if ($LASTEXITCODE -ne 0) { throw 'Candidate verification failed.' }
          $head = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/development" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify branch head.' }
          $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $latest.tag_name -notmatch '^v\d+\.\d+\.\d+$') { throw 'Cannot verify stable version.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          if ($head -ne $env:GITHUB_SHA -or [version]$version -le [version]($latest.tag_name.Substring(1))) {
            'eligible=false' >> $env:GITHUB_OUTPUT
            exit 0
          }
          'eligible=true' >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v6
        if: steps.verify.outputs.eligible == 'true'
        with:
          name: verified-release-candidate
          path: candidate/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish stable release
    needs: verify
    if: needs.verify.outputs.eligible == 'true' && github.ref == 'refs/heads/development' && github.repository == 'ENG-mohammed-fares/AgentOffice'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_RUN_ID: ${{ github.run_id }}
      EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: verified-release-candidate
          path: candidate
      - name: Publish immutable tested artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:EXPECTED_VERSION
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version.' }
          $manifest = Get-Content candidate/manifest.json -Raw | ConvertFrom-Json
          if ($manifest.commit -ne $env:GITHUB_SHA -or $manifest.version -ne $version -or "$($manifest.run_id)" -ne $env:EXPECTED_RUN_ID -or $manifest.ref -ne 'refs/heads/development' -or $manifest.locked -ne $true) { throw 'Manifest mismatch.' }
          function Assert-Eligible {
            $head = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/development" --jq '.object.sha'
            if ($LASTEXITCODE -ne 0 -or $head -ne $env:GITHUB_SHA) { throw 'Development changed; use newer candidate.' }
            $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $latest.tag_name -notmatch '^v\d+\.\d+\.\d+$' -or [version]$version -le [version]($latest.tag_name.Substring(1))) { throw 'Version no longer eligible.' }
          }
          Assert-Eligible
          $exe = "AgentOffice-Setup-$version-x64.exe"
          $names = @($exe, "$exe.blockmap", 'latest.yml')
          foreach ($name in $names) {
            $hash = (Get-FileHash -Algorithm SHA256 "candidate/$name").Hash.ToLowerInvariant()
            if ($hash -ne $manifest.sha256.PSObject.Properties[$name].Value) { throw "Hash mismatch: $name" }
          }
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release or draft already exists; never overwrite.' }
          $files = @($names | ForEach-Object { "candidate/$_" })
          $notes = "Automated stable release from development commit $env:GITHUB_SHA; successful CI run $env:GITHUB_RUN_ID."
          gh release create $tag @files candidate/manifest.json --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "AgentOffice $version" --notes $notes --draft
          if ($LASTEXITCODE -ne 0) { throw 'Draft upload failed.' }
          $draft = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft,assets,tagName,targetCommitish | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $draft.isDraft -or $draft.tagName -ne $tag -or $draft.targetCommitish -ne $env:GITHUB_SHA -or $draft.assets.Count -ne 4) { throw 'Draft validation failed.' }
          foreach ($name in ($names + @('manifest.json'))) {
            $asset = @($draft.assets | Where-Object { $_.name -eq $name })
            if ($asset.Count -ne 1 -or $asset[0].size -ne (Get-Item "candidate/$name").Length) { throw "Asset mismatch: $name" }
          }
          Assert-Eligible
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publication failed.' }
          $published = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $published.tag_name -ne $tag -or $published.draft -or $published.prerelease) { throw 'Publication verification failed.' }
          Write-Host "Published: $($published.html_url)"
