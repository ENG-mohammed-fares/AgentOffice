name: Office lighting and preview candidates

on:
  push:
    branches: ['perf/1.6.17-lightmap-candidate']
    paths:
      - 'assets/agile-office/bake-office-candidate.py'
      - '.github/workflows/office-bake-candidate.yml'
      - 'assets/agile-office/build_scene.py'
      - 'assets/agile-office/export_glb.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: office-bake-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Generate the original office without changing its sources
        run: |
          python -m pip install --only-binary :all: "numpy==2.3.5" "scipy==1.17.0" "trimesh==4.11.1" "Pillow==12.3.0"
          python assets/agile-office/build_scene.py
          python assets/agile-office/export_glb.py
          python -m py_compile assets/agile-office/bake-office-candidate.py
      - name: Install Blender from the signed Ubuntu package repository
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y blender
          blender --version
      - name: Render native Full HD views and bake diffuse lighting
        run: |
          mkdir -p office-candidates
          blender --background --factory-startup --python-exit-code 1 --python assets/agile-office/bake-office-candidate.py -- --source assets/agile-office/office.glb --layout assets/agile-office/scene.json --output office-candidates --samples 16 --atlas 1024
      - name: Verify native previews and encode candidate WebP files
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          for i in range(3):
              path = Path("office-candidates") / f"view-{i}.png"
              with Image.open(path) as im:
                  assert im.size == (1920, 1080), im.size
                  im.convert("RGB").save(path.with_suffix(".webp"), quality=92, method=6)
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: office-lighting-review-candidates
          path: office-candidates/
          if-no-files-found: warn
          retention-days: 14
