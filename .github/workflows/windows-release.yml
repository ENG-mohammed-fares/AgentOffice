name: Prepare AgentOffice release draft (manual only)

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful AgentOffice CI run ID from current main
        required: true
        type: string
      version:
        description: Exact new version from release-version.txt (example 1.7.0)
        required: true
        type: string
      confirm:
        description: Type PREPARE DRAFT after reviewing the QA candidate
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: agentoffice-draft-release
  cancel-in-progress: false

jobs:
  verify-candidate:
    name: Verify approved candidate
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'PREPARE DRAFT'
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_RUN_ID: ${{ inputs.ci_run_id }}
      EXPECTED_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify CI provenance and version
        shell: pwsh
        run: |
          if ($env:EXPECTED_RUN_ID -notmatch '^\d+$' -or $env:EXPECTED_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid run ID or version.' }
          $workflow = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify CI workflow.' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:EXPECTED_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read CI run.' }
          if ($run.workflow_id -ne $workflow.id -or $run.conclusion -ne 'success' -or $run.status -ne 'completed' -or $run.head_branch -ne 'main' -or $run.head_sha -ne $env:GITHUB_SHA -or $run.event -notin @('push','workflow_dispatch') -or $run.head_repository.full_name -ne $env:GITHUB_REPOSITORY) {
            throw 'Only a successful CI run for this exact main commit is eligible.'
          }
          if ((Get-Content release-version.txt -Raw).Trim() -ne $env:EXPECTED_VERSION) { throw 'Version mismatch.' }
          $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify latest stable release.' }
          if ([version]$env:EXPECTED_VERSION -le [version]($latest.tag_name.TrimStart('v'))) { throw 'Version must be newer than production.' }
          gh run download $env:EXPECTED_RUN_ID --repo $env:GITHUB_REPOSITORY --name agentoffice-windows-candidate --dir candidate
          if ($LASTEXITCODE -ne 0) { throw 'Could not download tested candidate.' }
          python scripts/release-candidate.py verify
          if ($LASTEXITCODE -ne 0) { throw 'Candidate validation failed.' }
      - uses: actions/upload-artifact@v6
        with:
          name: verified-release-candidate
          path: candidate/
          if-no-files-found: error
          retention-days: 7

  prepare-draft:
    name: Prepare draft only - never publish
    needs: verify-candidate
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_RUN_ID: ${{ inputs.ci_run_id }}
      EXPECTED_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: verified-release-candidate
          path: candidate
      - name: Verify hashes and prepare unpublished GitHub draft
        shell: pwsh
        run: |
          $manifest = Get-Content candidate/manifest.json -Raw | ConvertFrom-Json
          if ($manifest.commit -ne $env:GITHUB_SHA -or $manifest.version -ne $env:EXPECTED_VERSION -or "$($manifest.run_id)" -ne $env:EXPECTED_RUN_ID) { throw 'Manifest mismatch.' }
          $head = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:GITHUB_SHA) { throw 'Main changed; review a fresh candidate.' }
          $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or [version]$env:EXPECTED_VERSION -le [version]($latest.tag_name.TrimStart('v'))) { throw 'Version no longer eligible.' }
          $exe = "AgentOffice-Setup-$env:EXPECTED_VERSION-x64.exe"
          $names = @($exe, "$exe.blockmap", 'latest.yml')
          foreach ($name in $names) {
            $hash = (Get-FileHash -Algorithm SHA256 "candidate/$name").Hash.ToLowerInvariant()
            if ($hash -ne $manifest.sha256.PSObject.Properties[$name].Value) { throw "Hash mismatch: $name" }
          }
          $tag = "v$env:EXPECTED_VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw 'A release or draft already exists; review it manually.' }
          $files = @($names | ForEach-Object { "candidate/$_" })
          $notes = "QA candidate from commit $env:GITHUB_SHA and CI run $env:EXPECTED_RUN_ID. This draft is NOT published. Release owner must test and manually publish."
          gh release create $tag @files candidate/manifest.json --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "AgentOffice $env:EXPECTED_VERSION" --notes $notes --draft
          if ($LASTEXITCODE -ne 0) { throw 'Draft preparation failed.' }
          $draft = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft,assets,url | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $draft.isDraft -or $draft.assets.Count -ne 4) { throw 'Draft asset validation failed.' }
          Write-Host "Draft ready for manual review: $($draft.url)"
