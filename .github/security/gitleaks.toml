title = "AgentOffice secret detection"
[extend]
useDefault = true

# Both findings were reviewed: same Supabase publishable key in the historical
# JSON and the immutable source ZIP. Never allowlist the file by itself.
[[allowlists]]
description = "Only Supabase public client keys in the reviewed identity configuration"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^app/electron/identity-config\.json$''', '''^AgentOffice-Source\.zip!electron/identity-config\.json$''']
regexes = ['''^sb_publishable_[A-Za-z0-9_-]{31}$''']
